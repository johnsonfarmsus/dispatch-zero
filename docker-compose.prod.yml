x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    restart: unless-stopped
    logging: *default-logging
    # In prod we drop the host port publishing — Caddy reaches it via the docker network
    ports: !reset []
    environment:
      APP_ENV: production
    volumes:
      - /opt/dispatchzero/uploads:/uploads

  db:
    restart: unless-stopped
    logging: *default-logging
    ports: !reset []   # internal only

  redis:
    restart: unless-stopped
    logging: *default-logging
    ports: !reset []   # internal only

volumes:
  caddy_data:
  caddy_config:

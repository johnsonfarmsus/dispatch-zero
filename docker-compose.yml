services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Init scripts in /docker-entrypoint-initdb.d/ run ONCE on first boot of
      # an empty data volume. Used to create the dispatchzero_test database
      # for the pytest suite. No-op on the production VPS (volume already
      # initialized); only fires for fresh clones and CI.
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: prod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bound to 127.0.0.1 only — Caddy on the same host (or the dev laptop) is the
      # sole consumer. The wildcard --forwarded-allow-ips below is safe BECAUSE of
      # this binding: nobody on the public internet can reach 8000 directly.
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn dispatchzero.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"

volumes:
  db_data:
